<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Visual Novel Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171522;color:#f5f2ff;font:15px system-ui}header{padding:18px;background:#29233b}h1{font-size:21px;margin:0}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#211c30}button{border:0;border-radius:10px;padding:11px 14px;background:#7554b8;color:white;font-weight:600}nav button{white-space:nowrap}.wrap{padding:14px;max-width:850px;margin:auto}.panel{background:#262136;padding:14px;border-radius:14px;margin:12px 0}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border-radius:8px;border:1px solid #514766;background:#171522;color:white}textarea{min-height:90px}.scene{border:1px solid #55486c;padding:12px;border-radius:10px;margin:10px 0}.preview{min-height:230px;background:#0d0b12 center/cover no-repeat;border-radius:12px;padding:15px;display:flex;flex-direction:column;justify-content:end}.preview .dialog{background:#171522dd;padding:15px;border-radius:10px}.muted{color:#b9afca;font-size:13px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
</style></head><body>
<header><h1>My Visual Novel Studio</h1><div class="muted">Crea historias interactivas en 2D</div></header>
<nav><button onclick="tab('project')">Proyecto</button><button onclick="tab('assets')">Personajes y fondos</button><button onclick="tab('story')">Historia</button><button onclick="tab('test')">Probar</button></nav>
<main class="wrap">
<section id="project" class="panel"><h2>Nuevo proyecto</h2><label>Nombre</label><input id="projectName" placeholder="Mi novela visual"><label>Descripción</label><textarea id="projectDesc" placeholder="De qué trata tu historia..."></textarea><button onclick="save()">Guardar proyecto</button> <button onclick="exportProject()">Exportar proyecto JSON</button><p class="muted" id="saveState">Los proyectos se guardan en este dispositivo.</p></section>
<section id="assets" class="panel hidden"><h2>Recursos</h2><label>Importar personajes PNG/JPG</label><input id="characters" type="file" accept="image/*" multiple><div id="characterList" class="muted"></div><label>Importar fondos</label><input id="backgrounds" type="file" accept="image/*" multiple><div id="backgroundList" class="muted"></div></section>
<section id="story" class="panel hidden"><h2>Escenas</h2><label>Personaje</label><select id="who"><option value="">Narrador</option></select><label>Fondo</label><select id="bg"><option value="">Sin fondo</option></select><label>Diálogo o narración</label><textarea id="line" placeholder="Escribe aquí..."></textarea><label>Opciones para el jugador (una por línea)</label><textarea id="choices" placeholder="Opción 1&#10;Opción 2"></textarea><button onclick="addScene()">Añadir escena</button><div id="sceneList"></div></section>
<section id="test" class="panel hidden"><h2>Vista previa</h2><div class="preview" id="preview"><div class="dialog"><div id="previewWho">Narrador</div><div id="previewLine">Tu historia aparecerá aquí.</div><div id="previewChoices"></div></div></div><div class="row"><button onclick="prevScene()">Anterior</button><button onclick="nextScene()">Siguiente</button></div></section>
</main>
<script>
let chars=[],bgs=[],scenes=[],at=0;
function tab(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='test')render()}
function loadFiles(input,target,arr,selectId){input.addEventListener('change',()=>{[...input.files].forEach(f=>{let r=new FileReader();r.onload=()=>{arr.push({name:f.name,data:r.result});target.innerHTML+= '<div>'+f.name+'</div>';let o=document.createElement('option');o.value=arr.length-1;o.textContent=f.name;document.getElementById(selectId).appendChild(o)};r.readAsDataURL(f)})})}
loadFiles(document.getElementById('characters'),document.getElementById('characterList'),chars,'who');loadFiles(document.getElementById('backgrounds'),document.getElementById('backgroundList'),bgs,'bg');
function addScene(){scenes.push({who:document.getElementById('who').value,bg:document.getElementById('bg').value,line:document.getElementById('line').value,choices:document.getElementById('choices').value.split('\n').filter(Boolean)});document.getElementById('line').value='';document.getElementById('choices').value='';listScenes()}
function listScenes(){document.getElementById('sceneList').innerHTML=scenes.map((s,i)=>'<div class="scene"><b>Escena '+(i+1)+'</b><p>'+esc(s.line)+'</p><button onclick="removeScene('+i+')">Eliminar</button> <button onclick="at='+i+';tab(\'test\')">Probar desde aquí</button></div>').join('')}
function removeScene(i){scenes.splice(i,1);listScenes()}
function render(){let s=scenes[at];if(!s){document.getElementById('previewLine').textContent='Añade escenas para probar tu novela.';return}document.getElementById('previewWho').textContent=s.who===''?'Narrador':chars[+s.who]?.name||'Personaje';document.getElementById('previewLine').textContent=s.line;document.getElementById('previewChoices').innerHTML=s.choices.map(c=>'<p>◆ '+esc(c)+'</p>').join('');let b=bgs[+s.bg];document.getElementById('preview').style.backgroundImage=b?'url('+b.data+')':''}
function nextScene(){if(at<scenes.length-1)at++;render()}function prevScene(){if(at>0)at--;render()}
function data(){return {name:projectName.value,description:projectDesc.value,characters:chars,backgrounds:bgs,scenes}}
function save(){localStorage.setItem('mvns-project',JSON.stringify(data()));saveState.textContent='Proyecto guardado.'}
function exportProject(){let blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novela-visual.json';a.click();URL.revokeObjectURL(a.href)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
try{let d=JSON.parse(localStorage.getItem('mvns-project'));if(d){projectName.value=d.name||'';projectDesc.value=d.description||'';chars=d.characters||[];bgs=d.backgrounds||[];scenes=d.scenes||[];chars.forEach((x,i)=>{let o=new Option(x.name,i);who.add(o)});bgs.forEach((x,i)=>bg.add(new Option(x.name,i)));listScenes()}}catch(e){}
</script></body></html>
